name: AJN Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, build, playback, and audio bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start application server
        run: |
          node dist/server.cjs > /tmp/ajn-server.log 2>&1 &
          echo $! > /tmp/ajn-server.pid
          for i in {1..40}; do
            if curl --fail --silent --show-error --max-time 5 http://localhost:3000/api/health > /tmp/ajn-health.json; then
              echo "AJN server is healthy after $i attempt(s)"
              cat /tmp/ajn-health.json
              exit 0
            fi
            delay=$((i / 10 + 1))
            [ "$delay" -gt 5 ] && delay=5
            echo "Health check attempt $i/40 failed; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "AJN server failed to become healthy"
          cat /tmp/ajn-server.log
          exit 1

      - name: AJN radio resource smoke
        run: |
          set -euo pipefail
          FAILED=0
          for endpoint in resources audio/hourly audio/segment; do
            safe_name="$(echo "$endpoint" | tr / -)"
            echo "=== /api/ajn/$endpoint ==="
            code="$(curl --silent --show-error --max-time 15 \
              --dump-header "/tmp/ajn-${safe_name}.headers" \
              --output "/tmp/ajn-${safe_name}.json" \
              --write-out '%{http_code}' \
              "http://localhost:3000/api/ajn/$endpoint")"
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              echo "FAILED: /api/ajn/$endpoint returned HTTP $code"
              FAILED=1
            fi
          done
          echo "=== resource payloads ==="
          for file in /tmp/ajn-resources.json /tmp/ajn-audio-hourly.json /tmp/ajn-audio-segment.json; do
            echo "--- $file ---"
            cat "$file" 2>/dev/null || true
            echo
          done
          [ "$FAILED" -eq 0 ]
      - name: Existing playback regression
        timeout-minutes: 5
        run: npm test
        env:
          AJN_TEST_URL: http://localhost:3000

      - name: Capture server log after playback regression
        if: always()
        run: |
          echo "=== AJN server log ==="
          cat /tmp/ajn-server.log || true

      - name: EPG identity regression
        timeout-minutes: 5
        run: npm run test:epg-identity

      - name: EPG producer identity regression
        timeout-minutes: 5
        run: npm run test:epg-identity-producers

      - name: Classic TV canonical identity regression
        timeout-minutes: 5
        run: npm run test:classic-tv-canonical

      - name: Library integrity regression
        timeout-minutes: 5
        run: npm run test:library-integrity

      - name: Nova canonical regression
        timeout-minutes: 5
        run: npm run test:nova-canonical

      - name: Movies Classics producer regression
        timeout-minutes: 5
        run: npm run test:movies-classics-producer

      - name: Movies Classics integration regression
        timeout-minutes: 5
        run: npm run test:movies-classics

      - name: Real Archive playback gates
        run: npm run test:real-archive-playback
        env:
          AJN_TEST_URL: http://localhost:3000

      - name: AJN RSS canonical regression
        timeout-minutes: 5
        run: npm run test:ajn-rss-canonical

      - name: AJN audio canonical regression
        timeout-minutes: 5
        run: npm run test:ajn-audio-canonical

      - name: API contract regression
        timeout-minutes: 5
        run: npm run test:api-contract

      - name: Accessibility regression
        timeout-minutes: 5
        run: npm run test:accessibility

      - name: Audio/video switch regression
        timeout-minutes: 5
        run: npm run test:audio-video-switch

      - name: Audio bridge browser regression
        timeout-minutes: 5
        run: npm run test:audio

      - name: AudioContext singleton regression
        timeout-minutes: 5
        run: npm run test:audio-singleton

      - name: Browser journey regression
        timeout-minutes: 5
        run: npm run test:browser-journeys

      - name: Real Archive playback gates
        timeout-minutes: 10
        run: npm run test:real-archive-playback

      - name: Visual regression screenshots
        timeout-minutes: 10
        run: |
          mkdir -p /tmp/ajn-visual
          node <<'NODE'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 1360, height: 768 });
              for (const [name, hash] of [
                ['home', ''],
                ['library', '#library'],
                ['guide', '#tv-guide'],
                ['search', '#search'],
                ['player', '#player'],
              ]) {
                await page.goto(`http://localhost:3000/${hash}`, { waitUntil: 'networkidle0', timeout: 30000 });
                await page.screenshot({ path: `/tmp/ajn-visual/${name}.png`, fullPage: true });
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajn-visual-regression-recently-played
          path: /tmp/ajn-visual/
          if-no-files-found: ignore

      - name: Stop application server
        if: always()
        run: |
          if [ -f /tmp/ajn-server.pid ]; then
            kill "$(cat /tmp/ajn-server.pid)" || true
          fi
          if [ -f /tmp/ajn-server.log ]; then
            echo "--- AJN server log ---"
            cat /tmp/ajn-server.log
          fi
