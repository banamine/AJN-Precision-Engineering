name: AJN Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build, playback, and audio bridge tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Existing playback regression
        run: npm test

      - name: Audio bridge browser regression
        run: npm run test:audio

      # CI trigger verification marker: no application behavior change.
      - name: CI trigger marker
        run: echo "AJN Application CI trigger verified"
