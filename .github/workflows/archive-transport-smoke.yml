name: AJN Archive Transport Smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "AJN deployed base URL"
        required: true
        default: "https://ajn-precision-engineering.ai.studio"
  push:
    branches: ["rebuild/clean-baseline-20260906"]

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Archive proxy Range smoke tests
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://ajn-precision-engineering.ai.studio' }}
        run: |
          set -euo pipefail

          GOOD_PATH='/download/his_girl_friday/his_girl_friday_512kb.mp4'
          BAD_PATH='/download/FOXNEWSW_20260906_080000_My_View_With_Lara_Trump/FOXNEWSW_20260906_080000_My_View_With_Lara_Trump.mp4'
          GOOD_URL="$BASE_URL/api/archive/proxy?path=$(printf '%s' "$GOOD_PATH" | jq -sRr @uri)"
          BAD_URL="$BASE_URL/api/archive/proxy?path=$(printf '%s' "$BAD_PATH" | jq -sRr @uri)"
          EXPECTED_SIZE=401207987

          echo "WHO: GitHub Actions"
          echo "WHAT: Archive proxy transport gate"
          echo "WHY: verify real media responses, HTTP Range semantics, and no HTML/JSON leakage"
          echo "WHEN: $(date -u +%FT%TZ)"
          echo "FIXTURE_A: $GOOD_PATH"
          echo "FIXTURE_B: $BAD_PATH"
          echo "FIXTURE_A_EXPECTED_SIZE: $EXPECTED_SIZE"
          echo "TARGET: $GOOD_URL"

          run_fixed_range() {
            local range="$1"
            local label="$2"
            local expected_start="$3"
            local expected_length="$4"
            local headers="/tmp/${label}.headers"
            local body="/tmp/${label}.body"

            echo
            echo "=== TEST: $label ==="
            echo "RANGE: $range"

            curl --silent --show-error --fail-with-body \
              --dump-header "$headers" \
              --output "$body" \
              --max-time 30 \
              -H "Range: $range" \
              "$GOOD_URL"

            cat "$headers"
            echo "BODY_BYTES=$(wc -c < "$body")"

            local status
            status=$(awk 'NR==1 {print $2}' "$headers")
            local content_type
            content_type=$(awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' "$headers" | tr -d '\r' | tail -1)
            local content_range
            content_range=$(awk -F': ' 'tolower($1)=="content-range"{print $2}' "$headers" | tr -d '\r' | tail -1)
            local content_length
            content_length=$(awk -F': ' 'tolower($1)=="content-length"{print $2}' "$headers" | tr -d '\r' | tail -1)

            echo "STATUS=$status"
            echo "CONTENT_TYPE=$content_type"
            echo "CONTENT_RANGE=$content_range"
            echo "CONTENT_LENGTH=$content_length"

            [[ "$status" == "206" ]] || { echo "FAIL: expected HTTP 206"; exit 1; }
            [[ "$content_type" == video/* ]] || { echo "FAIL: expected video/* Content-Type"; exit 1; }
            [[ "$content_range" == bytes\ $expected_start-*/* ]] || { echo "FAIL: unexpected Content-Range"; exit 1; }
            [[ "$content_length" =~ ^[0-9]+$ ]] || { echo "FAIL: missing numeric Content-Length"; exit 1; }

            local actual
            actual=$(wc -c < "$body")
            [[ "$actual" == "$content_length" ]] || {
              echo "FAIL: body byte count ($actual) != Content-Length ($content_length)"
              exit 1
            }

            echo "PASS: $label"
          }

          run_open_ended_probe() {
            local range="$1"
            local label="$2"
            local expected_start="$3"
            local headers="/tmp/\${label}.headers"
            local body="/tmp/\${label}.body"

            echo
            echo "=== TEST: $label ==="
            echo "RANGE: $range"
            echo "MODE: open-ended continuation header probe"
            echo "WHY: validate terminal Content-Range/EOF without downloading the remaining ~400 MB fixture"

            # Use Python's streaming HTTP client so the test can inspect the terminal
            # response headers, read only one byte of media, and then close the
            # connection. This avoids a CI timeout being mistaken for success and
            # avoids downloading the entire open-ended remainder.
            set +e
            RANGE_VALUE="$range" GOOD_URL_VALUE="$GOOD_URL" HEADERS_FILE="$headers" BODY_FILE="$body" EXPECTED_START="$expected_start" EXPECTED_SIZE="$EXPECTED_SIZE" \
              python3 - <<'PY'
import os
import sys
import urllib.request

url = os.environ["GOOD_URL_VALUE"]
range_value = os.environ["RANGE_VALUE"]
headers_file = os.environ["HEADERS_FILE"]
body_file = os.environ["BODY_FILE"]

request = urllib.request.Request(
    url,
    headers={
        "Range": range_value,
        "Accept": "*/*",
        "User-Agent": "AJN-Archive-Transport-Smoke/1.0",
    },
    method="GET",
)

try:
    with urllib.request.urlopen(request, timeout=30) as response:
        with open(headers_file, "w", encoding="utf-8") as fh:
            fh.write(f"HTTP {response.status} {response.reason}\\n")
            for key, value in response.headers.items():
                fh.write(f"{key}: {value}\\n")

        first_byte = response.read(1)
        with open(body_file, "wb") as fh:
            fh.write(first_byte)

        if response.status != 206:
            print(f"FAIL: expected HTTP 206, got {response.status}")
            sys.exit(1)

        content_type = response.headers.get("Content-Type", "").lower()
        content_range = response.headers.get("Content-Range", "")

        if not content_type.startswith("video/"):
            print(f"FAIL: expected video/* Content-Type, got {content_type!r}")
            sys.exit(1)

        expected_prefix = f"bytes {os.environ['EXPECTED_START']}-"
        expected_suffix = f"/{os.environ['EXPECTED_SIZE']}"
        if not content_range.startswith(expected_prefix) or not content_range.endswith(expected_suffix):
            print(f"FAIL: unexpected Content-Range: {content_range!r}")
            sys.exit(1)

        if not first_byte:
            print("FAIL: open-ended probe returned zero media bytes")
            sys.exit(1)

        print(f"STATUS={response.status}")
        print(f"CONTENT_TYPE={content_type}")
        print(f"CONTENT_RANGE={content_range}")
        print("BODY_BYTES=1")
        print("PASS: terminal media headers and first media byte verified")
except Exception as exc:
    print(f"FAIL: open-ended transport probe failed: {exc}")
    sys.exit(1)
PY
            probe_exit=$?
            set -e

            cat "$headers" 2>/dev/null || true
            echo "PROBE_EXIT=$probe_exit"
            echo "BODY_BYTES=$(wc -c < "$body" 2>/dev/null || echo 0)"

            [[ "$probe_exit" -eq 0 ]] || {
              echo "FAIL: open-ended continuation probe failed"
              exit 1
            }

            echo "PASS: $label"
          }

          echo
          echo "=== FIXTURE A SIZE GATE ==="
          echo "Expected public fixture size: $EXPECTED_SIZE bytes"
          METADATA_URL="$BASE_URL/api/archive/metadata?path=$(printf '%s' "$GOOD_PATH" | jq -sRr @uri)"
          METADATA=$(curl --silent --show-error --fail --max-time 30 "$METADATA_URL")
          echo "$METADATA" | jq .
          METADATA_SIZE=$(echo "$METADATA" | jq -r '.contentLength // empty')
          [[ "$METADATA_SIZE" == "$EXPECTED_SIZE" ]] || {
            echo "FAIL: Fixture A content length is '$METADATA_SIZE', expected '$EXPECTED_SIZE'"
            exit 1
          }
          echo "PASS: fixture size gate"

          run_fixed_range "bytes=0-1023" "range_0_1023" "0" "1024"
          run_fixed_range "bytes=0-65535" "range_0_65535" "0" "65536"
          run_open_ended_probe "bytes=2097152-" "continuation_2mb" "2097152"
          run_open_ended_probe "bytes=5000000-" "continuation_5mb" "5000000"

          echo
          echo "=== TEST: unavailable_fixture_FOXNEWSW ==="
          echo "WHO: GitHub Actions"
          echo "WHAT: verify Archive 403 HTML is converted to AJN JSON"
          echo "WHY: an unavailable Archive asset must never be passed to <video> as HTML"
          echo "TARGET: $BAD_URL"

          BAD_HEADERS=/tmp/foxnewsw.headers
          BAD_BODY=/tmp/foxnewsw.body
          set +e
          curl --silent --show-error             --dump-header "$BAD_HEADERS"             --output "$BAD_BODY"             --max-time 60             -H 'Range: bytes=0-1023'             "$BAD_URL"
          BAD_CURL_EXIT=$?
          set -e

          cat "$BAD_HEADERS"
          echo "CURL_EXIT=$BAD_CURL_EXIT"
          echo "BODY_BYTES=$(wc -c < "$BAD_BODY")"
          echo "BODY_PREVIEW:"
          head -c 500 "$BAD_BODY" || true
          echo

          BAD_STATUS=$(awk 'NR==1 {print $2}' "$BAD_HEADERS")
          BAD_CONTENT_TYPE=$(awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' "$BAD_HEADERS" | tr -d '\r' | tail -1)
          echo "STATUS=$BAD_STATUS"
          echo "CONTENT_TYPE=$BAD_CONTENT_TYPE"

          [[ "$BAD_STATUS" == "403" ]] || { echo "FAIL: expected AJN HTTP 403 for unavailable Archive fixture"; exit 1; }
          [[ "$BAD_CONTENT_TYPE" == application/json* ]] || { echo "FAIL: expected application/json, not Archive HTML"; exit 1; }
          jq -e '.error and .upstreamStatus == 403 and .proxyRequestId' "$BAD_BODY" >/dev/null || {
            echo "FAIL: expected structured AJN JSON error"
            exit 1
          }
          ! grep -Eiq '<!doctype html|<html' "$BAD_BODY" || {
            echo "FAIL: HTML error document leaked through proxy"
            exit 1
          }
          echo "PASS: unavailable_fixture_FOXNEWSW"

          echo
          echo "RESULT: all Archive transport gates passed."
          echo "No synthetic telemetry was generated."
