name: AJN integrity guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard (pull request vs base)
        if: github.event_name == 'pull_request'
        run: node scripts/integrity-guard.mjs --base "origin/${{ github.base_ref }}"
      - name: Guard (push vs previous head)
        if: github.event_name == 'push'
        run: node scripts/integrity-guard.mjs --base "${{ github.event.before }}"
