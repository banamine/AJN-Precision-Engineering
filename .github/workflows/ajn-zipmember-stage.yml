name: ajn-zipmember-stage

# Builds seekable (fast-start) copies of Archive.org zip-member episodes ON GITHUB, with no window and
# no upload anywhere. Uses tools/zip-workbench/AJN_Zip_Workbench_v2.pyw --headless (same code as the desktop app).
# Default output: reports only (summary.txt, run-log.csv, playlist.csv, workbench.log).
# The episodes themselves are kept as an artifact ONLY if keep_media is ticked. This repository is PUBLIC, so
# anyone signed in to GitHub could download that artifact: decide that deliberately.
# Run: Actions tab -> ajn-zipmember-stage -> Run workflow. Start with limit = 1.

on:
  workflow_dispatch:
    inputs:
      playlist:
        description: 'Playlist file committed in this repo (preferred; no Archive listing page needed)'
        required: false
        default: 'data/zip-playlists/stargate-atlantis-s05-2008-eng-cc1-captions.m3u'
      item:
        description: 'Archive identifier (only used if playlist is empty)'
        required: false
        default: ''
      limit:
        description: 'Episodes to build (0 = all)'
        required: false
        default: '1'
      to_drive:
        description: 'Copy built episodes to your Google Drive folder (needs the RCLONE_CONF secret)'
        type: boolean
        required: false
        default: true
      drive_folder_id:
        description: 'Google Drive folder id to copy into'
        required: false
        default: '1AsF3nPqeR3ha2lEcOV7DDz-T_L1dIorD'
      keep_media:
        description: 'Keep the built .mp4 files as a downloadable artifact (repo is public!)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ajn-zipmember-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Self-tests (must pass before any download)
        working-directory: tools/zip-workbench
        run: |
          python test_workbench_v2.py
          python test_workbench_v2_extra.py
      - name: Drive preflight (fail fast, before any download)
        if: inputs.to_drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FOLDER: ${{ inputs.drive_folder_id }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::error::to_drive is on but the RCLONE_CONF secret is not set. See tools/zip-workbench/README.md (Drive setup)."; exit 1; fi
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          printf '%s' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          rclone --config "$RUNNER_TEMP/rclone.conf" lsd gdrive: --drive-root-folder-id "$FOLDER" >/dev/null
          echo "Drive folder reachable."
      - name: Prepare large output disk
        run: |
          sudo mkdir -p /mnt/ajn-out
          sudo chown "$USER" /mnt/ajn-out
          df -h / /mnt
      - name: Build files (no upload)
        env:
          ITEM: ${{ inputs.item }}
          PLAYLIST: ${{ inputs.playlist }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$PLAYLIST" ]; then SRC=(--playlist "$PLAYLIST"); else SRC=(--item "$ITEM"); fi
          python tools/zip-workbench/AJN_Zip_Workbench_v2.pyw --headless "${SRC[@]}" --out /mnt/ajn-out --limit "$LIMIT" --pause 3
      - name: Copy built episodes to Drive
        if: inputs.to_drive && success()
        env:
          FOLDER: ${{ inputs.drive_folder_id }}
        run: |
          rclone --config "$RUNNER_TEMP/rclone.conf" copy /mnt/ajn-out gdrive: --drive-root-folder-id "$FOLDER" --exclude "runs/**" --checksum --stats-one-line -v
          rclone --config "$RUNNER_TEMP/rclone.conf" check /mnt/ajn-out gdrive: --drive-root-folder-id "$FOLDER" --exclude "runs/**" --one-way
          echo "### Copied to Drive and verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove Drive credentials
        if: always() && inputs.to_drive
        run: rm -f "$RUNNER_TEMP/rclone.conf"
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zip-workbench-reports-${{ github.run_id }}
          path: /mnt/ajn-out/runs
          retention-days: 30
          if-no-files-found: warn
      - name: Keep built episodes (only if keep_media)
        if: always() && inputs.keep_media
        uses: actions/upload-artifact@v4
        with:
          name: zip-workbench-media-${{ github.run_id }}
          path: |
            /mnt/ajn-out
            !/mnt/ajn-out/runs/**
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
